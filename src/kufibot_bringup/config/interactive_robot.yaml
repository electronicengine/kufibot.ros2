dc_motor_node:
  ros__parameters:
    # Reverse the complete drivetrain polarity to match the robot's wiring.
    invert_left: false
    invert_right: true
    navigation_calibrated: false
    navigation_max_linear: 0.08
    navigation_max_angular: 0.20

voice_agent_node:
  ros__parameters:
    api_endpoint: "http://localhost:8000"
    trigger_uuid: "b1c382e1-63cc-406e-b556-7caf8bcb4d60"
    mic_device: "plughw:2,0"
    speaker_device: "default"
    ice_timeout_sec: 30.0
    sensor_max_age_sec: 2.0
    mute_mic_during_playback: true
    mic_noise_gate_rms: 450.0
    mic_noise_gate_hangover_sec: 0.5
    camera_max_age_sec: 1.0
    camera_jpeg_max_width: 640
    camera_jpeg_quality: 80
    camera_send_cooldown_sec: 2.0
    camera_attach_to_every_user_turn: true
    # The remote-control boot starts the voice session only after a client
    # selects AI mode.  Manual service start remains available in AI mode.
    auto_start: false
    remote_mode_controls_voice: true
    expression_model_path: "/usr/local/ai.models/llamaModel/mxbaiV1.gguf"
    expression_n_threads: 2
    expression_n_ctx: 512
    expression_n_gpu_layers: 0
    gesture_config_file: "/home/kufi/workspace/kufibot.cpp/config/gesture_config.json"
    motion_config_file: "/home/kufi/workspace/kufibot.cpp/config/motion_definitions.json"
    joint_angles_file: "/home/kufi/workspace/kufibot.cpp/config/joint_angles.json"

usb_camera_node:
  ros__parameters:
    device: "auto"
    width: 640
    height: 480
    fps: 15.0
    use_mjpeg: true
    buffer_size: 1
    frame_id: "camera_link"
    reconnect_interval_sec: 2.0
    max_consecutive_failures: 5

mediapipe_node:
  ros__parameters:
    # Face/hand model and tracking logic are unchanged; process newest frames
    # at a bounded rate so video encoding keeps CPU time on Raspberry Pi.
    inference_fps: 10.0
    min_detection_confidence: 0.6
    target_timeout_sec: 0.25
    error_threshold_px: 70.0
    release_threshold_px: 85.0
    max_error_px: 300.0
    minimum_step_deg: 0.15
    maximum_step_deg: 2.5
    control_rate_hz: 20.0
    neutral_step_deg: 1.0
    publish_debug_image: false

servo_arbiter:
  ros__parameters:
    default_control_mode: "remote"
    default_agent_hold_sec: 2.0
    max_agent_hold_sec: 10.0
    publish_rate_hz: 20.0

servo_node:
  ros__parameters:
    step_deg: 1.0
    arm_step_deg: 0.3
    step_delay_ms: 15.0

remote_controller:
  ros__parameters:
    port: 8080
    discovery_port: 8888
    robot_name: Kufibot
    # Low-latency view profile; raise these on a fast robot/network if needed.
    video_max_width: 480
    video_fps: 15.0

# Enable both calibrated flags only after completing docs/navigation.md.
navigation_node:
  ros__parameters:
    calibrated: false
    circular_footprint: false
    body_radius_m: 0.20
    lidar_forward_offset_m: 0.0
    stopping_distance_m: 0.15
    clearance_m: 0.10
    latency_margin_sec: 0.15
    linear_speed: 0.08
    angular_speed: 0.20
    head_center_deg: 90.0
    neck_horizontal_deg: 60.0
    head_sign: -1.0
    compass_turn_sign: -1.0
    lidar_yaw_offset_deg: 0.0
    camera_yaw_offset_deg: 0.0
    max_distance_m: 0.30
    max_turn_deg: 30.0
    scan_step_deg: 10.0
    settle_sec: 0.25
    sensor_age_sec: 0.30
    camera_age_sec: 1.0
    llm_timeout_sec: 60.0
    step_timeout_sec: 25.0
