# Parameters for `ros2 launch kufibot_simulation simulation.launch.py`.
# Mirrors interactive_robot.yaml, but the navigation/motor profile is tuned
# for the virtual home instead of a calibrated physical robot.

navigation_node:
  ros__parameters:
    calibrated: true
    circular_footprint: true
    body_radius_m: 0.16
    lidar_forward_offset_m: 0.085494
    lidar_lateral_offset_m: -0.036755
    stopping_distance_m: 0.15
    clearance_m: 0.10
    latency_margin_sec: 0.15
    head_center_deg: 90.0
    neck_horizontal_deg: 10.0
    head_sign: -1.0
    compass_turn_sign: -1.0
    compass_filter_window: 5
    # At 20 Hz, 2.5 rad/s jumps 7.2 degrees per control tick and cannot
    # reliably converge to the navigator's 2-degree heading tolerance.
    angular_speed_min_rad_s: 0.25
    angular_speed_max_rad_s: 1.0
    lidar_yaw_offset_deg: 0.0
    camera_yaw_offset_deg: 0.0
    scan_step_deg: 10.0
    settle_sec: 0.1
    sensor_age_sec: 0.30
    camera_age_sec: 1.0
    llm_timeout_sec: 60.0
    step_timeout_sec: 25.0

dc_motor_node:
  ros__parameters:
    invert_left: false
    invert_right: false
    navigation_calibrated: true
    navigation_max_linear: 0.5
    navigation_max_angular: 5.0

servo_arbiter:
  ros__parameters:
    default_control_mode: "remote"
    default_agent_hold_sec: 2.0
    max_agent_hold_sec: 10.0
    publish_rate_hz: 20.0

voice_agent_node:
  ros__parameters:
    api_endpoint: "http://localhost:8000"
    trigger_uuid: "b1c382e1-63cc-406e-b556-7caf8bcb4d60"
    mic_device: "default"
    speaker_device: "default"
    ice_timeout_sec: 30.0
    sensor_max_age_sec: 2.0
    mute_mic_during_playback: true
    camera_max_age_sec: 1.0
    camera_jpeg_max_width: 640
    camera_jpeg_quality: 80
    camera_send_cooldown_sec: 2.0
    camera_attach_to_every_user_turn: false
    auto_start: false
    remote_mode_controls_voice: true

remote_controller:
  ros__parameters:
    port: 8080
    discovery_port: 8888
    robot_name: "Kufibot (sim)"
    video_max_width: 480
    video_fps: 15.0

world_node:
  ros__parameters:
    # Camera on eyeRight, lidar on eyeLeft; poses follow model/rig.json.
    body_radius_m: 0.16
    robot_width_m: 0.32
    robot_height_m: 0.32
    head_center_deg: 90.0
    head_sign: -1.0
    lidar_yaw_offset_deg: 0.0
    camera_yaw_offset_deg: 0.0
    lidar_min_range_m: 0.2
    lidar_max_range_m: 8.0
    # Repeatable, hardware-like measurement noise. The simulator's collision
    # world remains exact; navigation receives these noisy sensor topics.
    sensor_noise_seed: 42
    lidar_noise_stddev_m: 0.02
    lidar_quantization_m: 0.005
    compass_noise_stddev_deg: 0.8
    camera_renderer: panda3d
    camera_width: 640
    camera_height: 480
    camera_fov_deg: 60.0
    twist_timeout_sec: 0.5
