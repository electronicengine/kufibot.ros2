[pytest]
testpaths =
    src/kufibot_navigation/test
    src/kufibot_remote/test
    src/kufibot_interaction/test
    src/kufibot_perception/test
    src/kufibot_simulation/test
python_files = test_*.py
addopts = --import-mode=importlib
norecursedirs = build install log .venv .git manual
pythonpath =
    src/kufibot_navigation
    src/kufibot_remote
    src/kufibot_actuators
    src/kufibot_sensors
    src/kufibot_perception
    src/kufibot_interaction
    src/kufibot_simulation
